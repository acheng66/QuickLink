server:
  port: 8001

spring:
  application:
    name: quick-link-project
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-config-${database.env:dev}.yaml
  data:
    redis:
      host: localhost
      port: 6379
  mvc:
    view:
      prefix: /templates/
      suffix: .html
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 开启 Publisher Confirm（发送确认），需与 RabbitTemplate 配合使用
    publisher-confirm-type: correlated
    # 开启 Publisher Returns（路由失败回调）
    publisher-returns: true
    listener:
      simple:
        # 手动 ACK，消费成功后才确认，保证消息不丢失
        acknowledge-mode: manual
        # 每次最多预取 10 条，防止消费者过载
        prefetch: 10
        concurrency: 1
        max-concurrency: 5

quick-link:
  domain:
    default: localhost:8001
  stats:
    locale:
      amap-key: 824c511f0997586ea016f979fdb23087
  goto-domain:
    white-list:
      enable: true
      names: '知乎,掘金,博客园'
      details:
        - zhihu.com
        - juejin.cn
        - cnblogs.com

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
